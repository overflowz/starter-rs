[package]
name = "starter-rs"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
bon = "3.10.3"
crossfire = { version = "3.1.22", features = ["tokio"] }
enum_dispatch = "0.3.13"
fastrace = { version = "0.7.19", features = ["enable"] }
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive", "std"] }
structstruck = "0.5.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
